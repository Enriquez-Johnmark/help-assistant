name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv from PyPI at a pinned version: fetching it from GitHub releases
      # failed CI three times with 504s (2026-11-08).
      - run: python3 -m pip install --user "uv==0.11.32"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}
      - run: uv sync --locked
      # The local embedding model (about 240 MB), downloaded once.
      - uses: actions/cache@v4
        with:
          path: data/models
          key: embedding-model-paraphrase-multilingual-MiniLM-L12-v2
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      # A3: every help page and test question says it is made up.
      - run: uv run check-made-up
